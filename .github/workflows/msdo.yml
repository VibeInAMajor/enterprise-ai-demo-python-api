name: Microsoft Security DevOps

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  id-token: write
  security-events: write

jobs:
  security:
    name: Microsoft Security DevOps
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # microsoft/security-devops-action v1.12.0
      - name: Run Bandit through Microsoft Security DevOps
        id: msdo
        uses: microsoft/security-devops-action@08976cb623803b1b36d7112d4ff9f59eae704de0
        with:
          tools: bandit
      # github/codeql-action v4; SARIF is available on public GitHub repositories.
      - name: Upload Microsoft Security DevOps SARIF
        if: always() && steps.msdo.outputs.sarifFile != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
          category: msdo-bandit
