name: Python PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-pr-validation:
    name: Python PR Validation
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock -r requirements-dev.lock
          python -m pip check
      - name: Lint and format
        run: |
          python -m flake8 src tests
          python -m black --check src tests
      - name: Type and syntax checks
        run: |
          python -m mypy src
          python -m compileall -q src tests
      - name: Tests and coverage
        run: |
          python -m pytest --junitxml=junit.xml --cov=src --cov-report=xml:coverage.xml --cov-fail-under=80
      - name: Security and dependency audit
        run: |
          python -m bandit -r src tests -ll -ii
          python -m pip_audit
