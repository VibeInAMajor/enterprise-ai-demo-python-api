[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-demo-python-api"
version = "0.1.0"
description = "Minimal FastAPI baseline for the enterprise AI pipeline demo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
